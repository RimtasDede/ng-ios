<div class="window">
  <div class="window-height">
    <lib-status-bar-global />

    <div class="app-box">
      <ng-content />
    </div>

    @if (isIconVisible()) {
      @if (app(); as app) {
        <div class="app-icon">
          <ng-container *ngComponentOutlet="app.icon"></ng-container>
        </div>
      }
    }
  </div>

  <lib-home-indicator />
</div>

<div class="window-overlay"></div>

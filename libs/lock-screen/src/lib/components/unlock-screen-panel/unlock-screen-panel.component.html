<div class="passcode-box">
  <span class="passcode-title">
    Enter Passcode
  </span>

  <lib-passcode-dots
    [passCode]="passCode()"
    [passCodeEntered]="enteredCode()"
    [invalid]="isPassCodeInvalid"
  />
</div>

<lib-keypad
  type="unlock"
  (keyPress)="appendCode($event)"
/>

<div class="controls-box">
  <button class="btn" type="button">Emergency</button>

  @if (enteredCode().length === 0) {
    <button
      class="btn"
      type="button"
    >
      Cancel
    </button>
  } @else {
    <button
      class="btn"
      type="button"
      (click)="deletePassCode()"
    >
      Delete
    </button>
  }
</div>

<div class="lock-screen-wallpaper-box" [m-panup-options]="{ threshold: 55 }" (m-panup)="homeIndicatorPanUp($event)">

  <div
    class="overlay"
    [class]="{
      'overlay--active': displayUnlock
    }"
  ></div>

  <lib-lock-screen-panel />

  @if (displayUnlock) {
    <lib-unlock-screen-panel
      (hide)="hideUnlock()"
    />
  }

  <lib-home-indicator
    (m-panup)="homeIndicatorPanUp($event)"
  />

</div>

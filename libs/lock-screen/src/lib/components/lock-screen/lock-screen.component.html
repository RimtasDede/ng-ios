@let screenState = screen();
@let activeWp = activeWallpaper();
@let inCustomizationMode = customizationMode();

@if (inCustomizationMode) {
  <lib-slider
    [initialSlide]="activeWp"
    [slidesGap]="10"
  >
    @for (wallpaper of wallpapers(); track $index) {
      @if (
        inCustomizationMode
        || $index === activeWp
      ) {
        <ng-container
          *libSliderSlide="wallpaper"
          [ngTemplateOutlet]="screenTemplate"
          [ngTemplateOutletContext]="{
            width: screenState.width * 0.7 + 'px',
            height: screenState.height * 0.7 + 'px',
            wallpaper: inTransition ? null : wallpaper,
          }"
        />
      }
    }
  </lib-slider>
} @else {
  <ng-container
    [ngTemplateOutlet]="screenTemplate"
    [ngTemplateOutletContext]="{
      wallpaper: inTransition ? null : activeWp,
    }"
  />
}

<ng-template
  #screenTemplate
  let-width="width"
  let-height="height"
  let-wallpaper="wallpaper"
>
  <div
    #wpBox
    class="lock-screen-wallpaper-box"
    [style]="{
      'width': width,
      'height': height,
      'background-image': wallpaper ? 'url(' + wallpaper + ')' : ''
    }"
    (m-press)="toggleCustomizationMode()"
  >
    <lib-lock-screen-panel />

    @if (displayUnlock) {
      <lib-unlock-screen-panel
        (hide)="hideUnlock()"
      />
    }

    <lib-home-indicator
      (m-panup)="homeIndicatorPanUp($any($event))"
      (m-panend)="resetPanUpState($event)"
    />
  </div>
</ng-template>

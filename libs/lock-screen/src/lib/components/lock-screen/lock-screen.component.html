<div #wpBox class="lock-screen-wallpaper-box">

  <lib-lock-screen-panel />

  @if (displayUnlock) {
    <lib-unlock-screen-panel
      (hide)="hideUnlock()"
    />
  }

  <lib-home-indicator
    (m-panstart)="start($event)"
    (m-panup)="homeIndicatorPanUp($any($event))"
    (m-panend)="resetPanUpState($event)"
  />

</div>

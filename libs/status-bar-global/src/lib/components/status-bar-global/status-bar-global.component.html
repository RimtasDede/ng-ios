<lib-status-bar class="status-bar">
  <lib-status-bar-left
    (m-panup)="lockScreenVerticalPan($any($event))"
    (m-pandown)="lockScreenVerticalPan($any($event))"
    (m-panend)="lockScreenVerticalPanRelease($any($event))"
  >
    <lib-status-bar-time />
  </lib-status-bar-left>
  <lib-status-bar-right>
    <lib-status-bar-signal-str />
    <lib-status-bar-wifi-str />
    <lib-status-bar-battery />
  </lib-status-bar-right>
</lib-status-bar>

@if (lockScreenDeltaY) {
  <lib-lock-screen-box
    [open]="false"
    [deltaY]="lockScreenDeltaY"
    [swipeRelease]="lockScreenReleaseDeltaY"
    (close)="lockScreenClose()"
  />
}

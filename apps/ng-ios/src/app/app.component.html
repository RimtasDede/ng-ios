<router-outlet></router-outlet>

<lib-state-manager />

<app-phone-frame
  id="phone-frame"
  class="phone-frame"
>
  <lib-status-bar-global />

  <!-- Today View -->
  <div
    #todayViewBox
    class="today-view-box"
    (swipeleft)="closeTodayView($event)"
  >
    <lib-today-view />
  </div>

  <!-- App Library -->
  <div
    #appLibraryBox
    class="app-library-box"
    (swiperight)="closeAppLibrary($event)"
  >
    <lib-app-library />
  </div>

  <div class="home">
    <!-- <lib-status-bar>
      <lib-status-bar-left
        (m-panup)="lockScreenVerticalPan($any($event))"
        (m-pandown)="lockScreenVerticalPan($any($event))"
        (m-panend)="lockScreenVerticalPanRelease($any($event))"
      >
        <ios-time />
      </lib-status-bar-left>

      <lib-status-bar-right>
        <ios-signal-str />
        <ios-wifi-str />
        <ios-battery />
      </lib-status-bar-right>
    </lib-status-bar> -->

    <div #homeApps class="home-apps">
      <div class="home-apps__apps">
        <app-apps-grid
          (swipeBeforeFirstPage)="openTodayView($event)"
          (swipeAfterLastPage)="openAppLibrary($event)"
          (panBeforeFirstPage)="panToTodayView($event)"
          (panAfterLastPage)="panToAppsSearch($event)"
        />
      </div>

      <div class="home-apps__fav-apps">
        <lib-home-screen-fav-apps-bar />
      </div>
    </div>
  </div>

  <div #blurOverlay class="home-blur-overlay"></div>

</app-phone-frame>

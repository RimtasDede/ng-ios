<router-outlet></router-outlet>

<app-phone-frame
  id="phone-frame"
  class="phone-frame"
>
  <div
    #todayViewBox
    class="today-view-box"
    (swipeleft)="closeTodayView($event)"
  >
    <lib-today-view />
  </div>

  <div class="home-grid">
    <div class="home-grid__status-bar">
      <div>
        <app-time />
      </div>
      <div>
        <app-battery />
      </div>
    </div>

    <div class="home-grid__apps">

      <app-apps-grid
        (swipeBeforeFirstPage)="openTodayView($event)"
        (swipeAfterLastPage)="openAppsSearch($event)"
        (panBeforeFirstPage)="panToTodayView($event)"
        (panAfterLastPage)="panToAppsSearch($event)"
      />

    </div>

    <div class="home-grid__fav-apps">

      <lib-home-screen-fav-apps-bar />

    </div>
  </div>

  <div #blurOverlay class="home-grid-blur-overlay"></div>

</app-phone-frame>
